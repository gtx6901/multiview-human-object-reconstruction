[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-hoi"
version = "1.0.0"
description = "Multi-view human and object reconstruction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.12,<2", "Pillow>=10",
  "torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "opencv-python>=4.10",
  "accelerate==0.34.2", "safetensors>=0.8", "omegaconf>=2.3",
  "transformers==4.41.2", "einops>=0.8", "timm>=1.0",
  "huggingface-hub>=0.23,<1", "rtmlib==0.0.13", "onnxruntime==1.20.1",
  "yacs>=0.1.8", "smplx==0.1.28", "scikit-image>=0.24", "trimesh>=4.4",
]

[project.scripts]
hoi = "hoi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
