mode: train
train:
  dataset: MvRgbDatasetTHuman4
  data:
    subject_name: mjj001
    data_dir: ../data/mjj001_animatable
    frame_range: [0, 99, 1]
    used_cam_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    load_smpl_pos_map: true
  pretrained_dir: null
  net_ckpt_dir: D:/Document/大四/暑校--数字人重建/work/mjj/cloth_dynamics/runs/mjj001/avatar
  prev_ckpt: null
  ckpt_interval:
    epoch: 10
    batch: 50000
  eval_interval: 1000
  eval_training_ids: [0, 4]
  eval_testing_ids: [49, 4]
  eval_img_factor: 1.0
  lr_init: 0.0005
  loss_weight:
    l1: 1.0
    lpips: 0.1
    offset: 0.005
  finetune_color: false
  batch_size: 1
  num_workers: 8
  random_bg_color: true
test:
  dataset: MvRgbDatasetTHuman4
  data:
    data_dir: ../data/mjj001_animatable
    frame_range: [0, 99, 1]
    subject_name: mjj001
  view_setting: camera
  render_view_idx: 4
  global_orient: true
  img_scale: 1.0
  save_mesh: false
  render_skeleton: false
  save_tex_map: false
  save_ply: false
  n_pca: 20
  sigma_pca: 2.0
  prev_ckpt: null
model:
  with_viewdirs: true
  random_style: false
